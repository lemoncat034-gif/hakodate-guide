<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>명탐정 코난 in 하코다테</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- 귀여운 폰트(Jua)와 가독성 좋은 폰트(Noto Sans KR) 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      /* 탐정 수첩 같은 모눈종이 배경 */
      background-color: #f4f6f9; 
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      color: #333; 
      max-width: 600px; 
      margin: 0 auto; 
      padding: 15px; 
    }
    
    /* 상단 타이틀 디자인 (코난 자켓 + 나비넥타이 테마) */
    .header-box {
      background-color: #0f3460; /* 코난 네이비 */
      color: white;
      text-align: center;
      padding: 25px 20px;
      border-radius: 15px 15px 0 0;
      border-bottom: 6px solid #e94560; /* 코난 레드 */
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
    /* 나비넥타이 아이콘 */
    .header-box::after {
      content: '🎀';
      font-size: 32px;
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
    }
    h1 { font-family: 'Jua', sans-serif; margin: 0 0 5px 0; font-size: 1.8rem; letter-spacing: 1px; }
    .subtitle { color: #a9cce3; margin: 0; font-size: 0.95rem; }

    /* 공지사항 (포스트잇 느낌) */
    .notice { 
      background: #fff9c4; 
      color: #5c4b00; 
      padding: 15px 20px; 
      border-radius: 2px 15px 15px 15px; 
      margin: 35px 0 20px 0; 
      font-weight: bold; 
      text-align: center; 
      box-shadow: 2px 3px 8px rgba(0,0,0,0.08);
      border-left: 6px solid #fbc02d;
      position: relative;
    }
    .notice::before {
      content: '📌';
      position: absolute;
      top: -12px;
      left: -10px;
      font-size: 24px;
    }

    /* 카드형 UI (사건 파일 느낌) */
    .card { 
      background: white; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
      border: 2px solid #0f3460;
    }
    h2 { 
      font-family: 'Jua', sans-serif;
      color: #0f3460; 
      border-bottom: 2px dashed #0f3460; 
      padding-bottom: 8px; 
      margin-top: 0; 
      font-size: 1.3rem; 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 리스트 및 뱃지 스타일 */
    .res-item, .time-item { display: flex; margin-bottom: 12px; align-items: flex-start; }
    .res-type { font-weight: bold; width: 75px; flex-shrink: 0; color: #0f3460; }
    .time-badge { 
      background: #e94560; /* 코난 레드 */
      color: white; 
      padding: 4px 10px; 
      border-radius: 20px; /* 동글동글하게 */
      font-size: 0.85rem; 
      font-weight: bold; 
      margin-right: 15px; 
      height: fit-content; 
      min-width: 50px; 
      text-align: center; 
      box-shadow: 1px 2px 4px rgba(233, 69, 96, 0.3);
    }
    .task { padding-top: 2px; line-height: 1.4; word-break: keep-all; }

    /* 로딩 애니메이션 (코난 스케이트보드) */
    #loading { text-align: center; color: #0f3460; font-family: 'Jua', sans-serif; font-size: 1.3rem; margin-top: 80px; }
    .skater { font-size: 2.5rem; display: inline-block; animation: skate 1.5s infinite alternate ease-in-out; margin-bottom: 10px; }
    @keyframes skate {
      0% { transform: translateX(-30px) rotate(-5deg); }
      100% { transform: translateX(30px) rotate(5deg); }
    }
  </style>
</head>
<body>

  <!-- 로딩 화면 -->
  <div id="loading">
    <div class="skater">🛹</div>
    <div>진실은 언제나 하나!<br>일정을 불러오는 중입니다...</div>
  </div>
  
  <!-- 실제 콘텐츠 화면 -->
  <div id="app" style="display: none;">
    
    <div class="header-box">
      <h1 id="title"></h1>
      <p class="subtitle" id="dates"></p>
    </div>

    <div id="notice-container"></div>
    
    <div class="card" id="reservations-card">
      <!-- 이번 극장판 주인공인 괴도키드 모자 아이콘 -->
      <h2>🎩 예약 정보</h2>
      <div id="reservations"></div>
    </div>

    <div id="itinerary-container"></div>
  </div>

  <script>
    // 연결하신 구글 시트 주소
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTnL6jnu_5fghrhz720BFaxs-jlmqBaDOrysElX-PzwGs1GVJBm4_wDTOS8lG8Q3jwU21UuKi--CJ9l/pub?output=csv";

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(results) {
        const data = results.data;
        
        let title = "", dates = "", notice = "";
        let reservations = [];
        let itineraryMap = {};

        data.forEach(row => {
          if (!row['분류'] || row['분류'].trim() === '') return; 

          const category = row['분류'].trim();
          const itemTime = (row['항목/시간'] || '').trim();
          const content = (row['내용'] || '').trim();

          if (category === '기본정보') {
            if (itemTime === '제목') title = content;
            if (itemTime === '날짜') dates = content;
            if (itemTime === '공지사항') notice = content;
          } 
          else if (category === '예약') {
            reservations.push({ type: itemTime, detail: content });
          } 
          else {
            if (!itineraryMap[category]) {
              itineraryMap[category] = [];
            }
            itineraryMap[category].push({ time: itemTime, task: content });
          }
        });

        document.getElementById('title').textContent = title;
        document.getElementById('dates').textContent = dates;
        
        if (notice) {
          document.getElementById('notice-container').innerHTML = `<div class="notice">${notice}</div>`;
        }

        if (reservations.length > 0) {
          document.getElementById('reservations').innerHTML = reservations.map(res => 
            `<div class="res-item"><span class="res-type">${res.type}</span> <span class="task">${res.detail}</span></div>`
          ).join('');
        } else {
          document.getElementById('reservations-card').style.display = 'none';
        }

        let itinHtml = '';
        for (const [day, events] of Object.entries(itineraryMap)) {
          itinHtml += `
            <div class="card">
              <!-- 탐정의 돋보기 아이콘 -->
              <h2>🔍 ${day}</h2>
              ${events.map(event => `
                <div class="time-item">
                  <span class="time-badge">${event.time}</span>
                  <span class="task">${event.task}</span>
                </div>
              `).join('')}
            </div>
          `;
        }
        document.getElementById('itinerary-container').innerHTML = itinHtml;

        // 약간의 딜레이를 주어 스케이트보드 로딩을 귀엽게 보여줍니다
        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('app').style.display = 'block';
        }, 500);
      },
      error: function(err) {
        document.getElementById('loading').innerHTML = "앗! 범인의 소행인가?<br>데이터를 불러오지 못했습니다 😢";
      }
    });
  </script>
</body>
</html>
