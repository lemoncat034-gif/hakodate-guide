<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>하코다테 여름여행 가이드</title>

<meta name="theme-color" content="#2F4550">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하코다테">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  --ink:#16324F;          /* 인쇄 잉크 남색 */
  --ink-soft:#5A6E82;
  --stamp:#B8332C;        /* 검표 도장 주홍 */
  --stock:#E7EDE3;        /* 硬券 연녹색 판지 */
  --stock-buff:#F0E7D2;   /* 버프색 판지 (예약권) */
  --perf:#9FB0A4;         /* 절취선 */
  --bg:#2F4550;           /* 개찰구 철제 */
  --bg-2:#3A5460;
  --radius:5px;
  --stub:64px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:520px;
  margin-inline:auto;
  font-family:'Noto Sans KR',sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 9px);
  min-height:100vh;
  line-height:1.5;
  word-break:keep-all;
}

/* ---------- 공통 티켓 ---------- */
.ticket{
  display:flex;
  background:var(--stock);
  border-radius:var(--radius);
  margin-bottom:14px;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 8px 18px rgba(0,0,0,.18);
  overflow:visible;
  position:relative;
}
.ticket--buff{background:var(--stock-buff)}
.stub{
  position:relative;
  flex:0 0 var(--stub);
  width:var(--stub);
  border-right:2px dashed var(--perf);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 0;
}
.stub::before,.stub::after{
  content:'';position:absolute;right:-8px;width:16px;height:16px;
  border-radius:50%;background:var(--bg);
}
.stub::before{top:-8px}
.stub::after{bottom:-8px}
.stub__label{
  writing-mode:vertical-rl;
  font-family:'Black Han Sans',sans-serif;
  font-size:.95rem;letter-spacing:.18em;
  color:var(--ink);opacity:.85;
}
.stub__time{
  font-family:'Roboto Mono',monospace;font-weight:500;
  font-size:1.02rem;letter-spacing:-.02em;color:var(--ink);
  text-align:center;line-height:1.15;
}
.stub__time small{display:block;font-size:.6rem;letter-spacing:.14em;color:var(--ink-soft);margin-top:4px}
.body{flex:1;min-width:0;padding:15px 16px}

/* ---------- 헤더 승차권 ---------- */
.masthead{
  position:relative;background:var(--stock);border-radius:var(--radius);
  padding:20px 18px 18px;margin-bottom:18px;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 10px 22px rgba(0,0,0,.22);
  overflow:hidden;
}
.masthead::after{ /* 개찰 펀치 구멍 */
  content:'';position:absolute;top:16px;right:16px;
  width:18px;height:18px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.masthead__rule{height:3px;background:var(--ink);margin-bottom:12px}
.masthead__eyebrow{
  font-family:'Roboto Mono',monospace;font-size:.66rem;letter-spacing:.32em;
  color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;
}
h1{
  font-family:'Black Han Sans',sans-serif;font-weight:400;
  font-size:1.72rem;line-height:1.2;letter-spacing:.01em;margin:0 0 10px;
}
.masthead__dates{
  display:inline-block;font-family:'Roboto Mono',monospace;font-size:.86rem;
  letter-spacing:.04em;color:var(--stamp);border:2px solid var(--stamp);
  border-radius:3px;padding:3px 9px;transform:rotate(-1.5deg);
}
.masthead__kanji{
  position:absolute;right:-6px;bottom:-16px;
  font-family:'Black Han Sans',sans-serif;font-size:4.4rem;
  color:var(--ink);opacity:.07;letter-spacing:.02em;pointer-events:none;
}

/* ---------- 오늘 브리핑 ---------- */
.today{
  background:var(--bg-2);border:2px solid rgba(231,237,227,.25);
  border-radius:var(--radius);padding:14px 15px;margin-bottom:18px;color:var(--stock);
}
.today__head{
  display:flex;align-items:baseline;gap:8px;margin-bottom:10px;
  font-family:'Roboto Mono',monospace;font-size:.68rem;letter-spacing:.24em;
  color:rgba(231,237,227,.6);text-transform:uppercase;
}
.today__day{
  font-family:'Black Han Sans',sans-serif;font-size:1.05rem;letter-spacing:.02em;
  color:var(--stock);
}
.today__row{display:flex;gap:12px;padding:8px 0;border-top:1px dotted rgba(231,237,227,.28)}
.today__time{
  font-family:'Roboto Mono',monospace;font-size:.92rem;font-weight:500;
  color:#F3C969;flex:0 0 50px;
}
.today__task{font-size:.92rem;font-weight:500}
.today__note{font-size:.85rem;color:rgba(231,237,227,.72);margin-top:2px}
.today__empty{font-size:.9rem;color:rgba(231,237,227,.75)}
.today__go{
  display:block;width:100%;margin-top:12px;padding:9px;
  background:none;border:1px solid rgba(231,237,227,.4);border-radius:3px;
  color:var(--stock);font-family:'Noto Sans KR',sans-serif;font-size:.85rem;font-weight:500;
  cursor:pointer;
}
.today__go:active{background:rgba(231,237,227,.12)}

/* ---------- 메인 메뉴 ---------- */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.menu__btn{
  position:relative;background:var(--stock);border:none;border-radius:var(--radius);
  padding:16px 12px 14px;text-align:left;cursor:pointer;color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 6px 14px rgba(0,0,0,.16);
  border-top:5px solid var(--ink);
}
.menu__btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.28), 0 3px 8px rgba(0,0,0,.16)}
.menu__num{
  font-family:'Roboto Mono',monospace;font-size:.64rem;letter-spacing:.2em;
  color:var(--ink-soft);display:block;margin-bottom:6px;
}
.menu__label{font-family:'Black Han Sans',sans-serif;font-size:1.15rem;display:block}
.menu__sub{font-size:.72rem;color:var(--ink-soft);margin-top:3px;display:block}
.menu__btn--stamp{background:var(--stock-buff);border-top-color:var(--stamp)}
.menu__btn--stamp .menu__label{color:var(--stamp)}

/* ---------- 화면 전환 ---------- */
.view{display:none}
.view.is-active{display:block;animation:slideIn .28s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.back{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;
  background:none;border:1px solid rgba(231,237,227,.45);border-radius:3px;
  color:var(--stock);padding:7px 13px;cursor:pointer;
  font-family:'Roboto Mono',monospace;font-size:.76rem;letter-spacing:.1em;
}
.back:active{background:rgba(231,237,227,.14)}
.view__title{
  font-family:'Black Han Sans',sans-serif;font-size:1.25rem;color:var(--stock);
  margin:0 0 14px;letter-spacing:.02em;
}
.view__title span{
  font-family:'Roboto Mono',monospace;font-size:.66rem;letter-spacing:.24em;
  color:rgba(231,237,227,.55);display:block;margin-bottom:3px;
}

/* ---------- 예약 티켓 ---------- */
.res__type{
  font-family:'Roboto Mono',monospace;font-size:.64rem;letter-spacing:.2em;
  color:var(--ink-soft);text-transform:uppercase;margin-bottom:5px;
}
.res__title{font-family:'Black Han Sans',sans-serif;font-size:1.12rem;margin:0 0 8px;letter-spacing:.01em}
.res__date{
  display:inline-block;font-family:'Roboto Mono',monospace;font-size:.8rem;
  color:var(--stamp);border-bottom:1px solid rgba(184,51,44,.35);margin-bottom:8px;
}
.res__detail{font-size:.9rem;line-height:1.6}
.res__actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- 일정 ---------- */
.day{
  background:var(--stock);border-radius:var(--radius);margin-bottom:16px;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 8px 18px rgba(0,0,0,.18);
  overflow:hidden;
}
.day__head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--ink);color:var(--stock);padding:11px 15px;
}
.day__name{font-family:'Black Han Sans',sans-serif;font-size:1.1rem;letter-spacing:.03em}
.day__date{font-family:'Roboto Mono',monospace;font-size:.74rem;opacity:.72;letter-spacing:.06em}
.day__body{padding:6px 15px 14px}
.stop{display:flex;gap:13px;padding:12px 0;border-bottom:1px dotted var(--perf)}
.stop:last-child{border-bottom:none}
.stop__time{
  flex:0 0 46px;font-family:'Roboto Mono',monospace;font-weight:500;
  font-size:.88rem;padding-top:1px;color:var(--ink);
}
.stop__time.is-blank{color:var(--perf)}
.stop__main{flex:1;min-width:0}
.stop__title{font-weight:700;font-size:.98rem;display:block}
.stop__desc{font-size:.87rem;color:#41535F;margin-top:3px;line-height:1.55}
.day--today{box-shadow:0 0 0 3px var(--stamp), 0 8px 18px rgba(0,0,0,.22)}
.day__now{
  font-family:'Roboto Mono',monospace;font-size:.62rem;letter-spacing:.16em;
  border:1.5px solid var(--stock);border-radius:2px;padding:2px 6px;
  transform:rotate(-2deg);
}

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--ink);color:var(--stock);border:none;border-radius:3px;
  padding:7px 13px;font-family:'Noto Sans KR',sans-serif;font-size:.8rem;font-weight:500;
  text-decoration:none;cursor:pointer;
}
.btn:active{opacity:.82}
.btn--ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.btn--done{background:var(--stamp)}
.stop .btn{margin-top:9px}

/* ---------- 공지 ---------- */
.notice{
  background:var(--stock-buff);border-radius:var(--radius);padding:20px 18px;
  border-left:6px solid var(--stamp);font-size:.94rem;line-height:1.75;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 8px 18px rgba(0,0,0,.18);
}
.notice__mark{
  font-family:'Roboto Mono',monospace;font-size:.64rem;letter-spacing:.22em;
  color:var(--stamp);display:block;margin-bottom:10px;
}

/* ---------- 상태 표시 ---------- */
.stale{
  display:flex;align-items:center;gap:8px;
  background:rgba(243,201,105,.14);border:1px dashed rgba(243,201,105,.55);
  border-radius:3px;padding:9px 12px;margin-bottom:14px;
  color:#F3C969;font-size:.78rem;font-family:'Roboto Mono',monospace;letter-spacing:.02em;
}
.stale button{
  margin-left:auto;background:none;border:1px solid rgba(243,201,105,.6);
  border-radius:2px;color:#F3C969;padding:4px 9px;font-size:.72rem;cursor:pointer;
  font-family:'Roboto Mono',monospace;
}
.empty{color:rgba(231,237,227,.7);font-size:.9rem;padding:8px 2px}

#loading{text-align:center;padding-top:100px;color:var(--stock)}
.gate{font-family:'Roboto Mono',monospace;font-size:.72rem;letter-spacing:.3em;opacity:.6;margin-bottom:18px}
.gate-ticket{
  width:140px;height:52px;margin:0 auto 20px;background:var(--stock);border-radius:3px;
  animation:feed 1.4s ease-in-out infinite;
}
@keyframes feed{0%{transform:translateY(14px);opacity:.25}50%{transform:translateY(-6px);opacity:1}100%{transform:translateY(14px);opacity:.25}}
#loading p{font-family:'Noto Sans KR',sans-serif;font-size:.9rem;opacity:.8;margin:0}

.fail{background:var(--stock);border-radius:var(--radius);padding:22px 18px;text-align:left}
.fail h2{font-family:'Black Han Sans',sans-serif;font-size:1.1rem;margin:0 0 8px}
.fail p{font-size:.88rem;color:var(--ink-soft);margin:0 0 14px;line-height:1.6}

:focus-visible{outline:3px solid #F3C969;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@media (max-width:340px){
  :root{--stub:52px}
  h1{font-size:1.45rem}
}
</style>
</head>
<body>

<div id="loading">
  <div class="gate">HAKODATE · 函館</div>
  <div class="gate-ticket"></div>
  <p>승차권을 발권하는 중입니다</p>
</div>

<main id="app" hidden>

  <header class="masthead">
    <div class="masthead__rule"></div>
    <div class="masthead__eyebrow">Travel Ticket</div>
    <h1 id="title"></h1>
    <div class="masthead__dates" id="dates"></div>
    <div class="masthead__kanji" aria-hidden="true">函館</div>
  </header>

  <div id="stale" hidden></div>

  <!-- 홈 -->
  <section id="view-home" class="view is-active">
    <div id="today" class="today" hidden></div>
    <nav class="menu">
      <button class="menu__btn" data-go="reservations">
        <span class="menu__num">NO. 01</span>
        <span class="menu__label">예약 정보</span>
        <span class="menu__sub">항공 · 숙소 · 티켓</span>
      </button>
      <button class="menu__btn" data-go="itinerary">
        <span class="menu__num">NO. 02</span>
        <span class="menu__label">여행 일정</span>
        <span class="menu__sub">일차별 동선</span>
      </button>
      <button class="menu__btn" data-go="notice">
        <span class="menu__num">NO. 03</span>
        <span class="menu__label">중요 메모</span>
        <span class="menu__sub">꼭 확인할 것</span>
      </button>
      <button class="menu__btn menu__btn--stamp" data-go="secret">
        <span class="menu__num">NO. 04</span>
        <span class="menu__label">APTX4869</span>
        <span class="menu__sub">???</span>
      </button>
    </nav>
  </section>

  <!-- 예약 -->
  <section id="view-reservations" class="view">
    <button class="back" data-go="home">◀ 홈</button>
    <h2 class="view__title"><span>NO. 01 / RESERVATION</span>예약 정보</h2>
    <div id="reservations"></div>
  </section>

  <!-- 일정 -->
  <section id="view-itinerary" class="view">
    <button class="back" data-go="home">◀ 홈</button>
    <h2 class="view__title"><span>NO. 02 / ITINERARY</span>여행 일정</h2>
    <div id="itinerary"></div>
  </section>

  <!-- 공지 -->
  <section id="view-notice" class="view">
    <button class="back" data-go="home">◀ 홈</button>
    <h2 class="view__title"><span>NO. 03 / MEMO</span>중요 메모</h2>
    <div id="notice"></div>
  </section>

  <!-- 시크릿 -->
  <section id="view-secret" class="view">
    <button class="back" data-go="home">◀ 홈</button>
    <div class="notice">
      <span class="notice__mark">APTX4869</span>
      진실은 언제나 하나!<br>하코다테에서 멋진 추억을 남기세요 🕵️‍♂️
    </div>
  </section>

</main>

<script>
/* =========================================================
   설정
   ========================================================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTnL6jnu_5fghrhz720BFaxs-jlmqBaDOrysElX-PzwGs1GVJBm4_wDTOS8lG8Q3jwU21UuKi--CJ9l/pub?output=csv";
const CACHE_KEY = "hakodate-guide-v1";
const VIEWS = ["home","reservations","itinerary","notice","secret"];

/* =========================================================
   유틸
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");

function store(key, val){
  try{ val === undefined ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ /* 시크릿 모드 등 저장 불가 환경 */ }
}
function read(key){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}

/* "09:30", "9:30", "0930", "9시" → 분 단위 숫자 */
function toMinutes(t){
  if(!t) return null;
  const m = String(t).match(/(\d{1,2})\s*[:시.]\s*(\d{1,2})?/);
  if(m) return (+m[1])*60 + (+(m[2]||0));
  const h = String(t).match(/^(\d{1,2})$/);
  return h ? (+h[1])*60 : null;
}
const pad = n => String(n).padStart(2,"0");
const fmtTime = min => min===null ? "" : pad(Math.floor(min/60))+":"+pad(min%60);
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

/* =========================================================
   화면 전환 (해시 라우팅 → 폰 뒤로가기 정상 동작)
   ========================================================= */
function render(){
  const name = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
  VIEWS.forEach(v => {
    const el = $("view-"+v);
    if(el) el.classList.toggle("is-active", v===name);
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if(go){ location.hash = go.dataset.go === "home" ? "" : "#"+go.dataset.go; if(go.dataset.go==="home") render(); }

  const copy = e.target.closest("[data-copy]");
  if(copy) doCopy(copy);
});

function doCopy(btn){
  const text = btn.dataset.copy;
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "복사됨";
    btn.classList.add("btn--done");
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove("btn--done"); }, 1600);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text,done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}

/* =========================================================
   데이터 파싱
   ========================================================= */
function parseRows(rows){
  const info = {}; const reservations = []; const dayMap = {};
  let lastCategory = "";

  rows.forEach(row => {
    const cur = (row["분류"]||"").trim();
    const category = cur || lastCategory;
    if(cur) lastCategory = cur;

    const item  = (row["항목"]||"").trim();
    const when  = (row["날짜/시간"]||"").trim();
    const title = (row["제목"]||"").trim();
    const body  = (row["내용"]||"").trim();
    const link  = (row["링크"]||"").trim();
    const linkName = (row["링크명"]||"").trim();

    if(!category && !item) return;

    if(category === "기본정보"){
      info[item] = title || body || when;
    } else if(category === "예약"){
      reservations.push({ type:item, date:when, title, detail:body, link, linkName });
    } else if(category === "일정" && item){
      (dayMap[item] = dayMap[item] || []);
      if(when || title || body){
        dayMap[item].push({ time:when, title, detail:body, link, linkName, min:toMinutes(when) });
      }
    }
  });

  // 시간순 정렬 (시간 없는 항목은 원래 순서 유지, 뒤로)
  Object.values(dayMap).forEach(list => {
    list.forEach((e,i)=> e._i = i);
    list.sort((a,b)=>{
      const am = a.min===null ? Infinity : a.min, bm = b.min===null ? Infinity : b.min;
      return am===bm ? a._i-b._i : am-bm;
    });
  });

  // 일차별 날짜 계산: 항목명 안의 8/12 형태 우선, 없으면 기본정보 '시작일' + n일
  const days = Object.keys(dayMap);
  const start = info["시작일"] ? new Date(info["시작일"].replace(/[./]/g,"-")) : null;
  const dayDates = {};
  days.forEach((name, i) => {
    const m = name.match(/(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})/);
    if(m){
      const y = start && !isNaN(start) ? start.getFullYear() : new Date().getFullYear();
      dayDates[name] = ymd(new Date(y, +m[1]-1, +m[2]));
    } else if(start && !isNaN(start)){
      const d = new Date(start); d.setDate(d.getDate()+i);
      dayDates[name] = ymd(d);
    }
  });

  return { info, reservations, dayMap, days, dayDates };
}

/* =========================================================
   그리기
   ========================================================= */
function draw(data, meta){
  const { info, reservations, dayMap, days, dayDates } = data;

  $("title").textContent = info["제목"] || "여행 가이드";
  $("dates").textContent = info["날짜"] || "";
  $("dates").hidden = !info["날짜"];
  document.title = info["제목"] || document.title;

  // --- 오늘 브리핑 ---
  drawToday(dayMap, days, dayDates);

  // --- 예약 ---
  $("reservations").innerHTML = reservations.length ? reservations.map(r => {
    const copyText = [r.type, r.title, r.date, r.detail].filter(Boolean).join("\n");
    return `
    <article class="ticket ticket--buff">
      <div class="stub"><span class="stub__label">${esc(r.type||"예약")}</span></div>
      <div class="body">
        <div class="res__type">Reservation</div>
        ${r.title ? `<h3 class="res__title">${esc(r.title)}</h3>` : ""}
        ${r.date ? `<div class="res__date">${esc(r.date)}</div>` : ""}
        ${r.detail ? `<div class="res__detail">${nl(r.detail)}</div>` : ""}
        <div class="res__actions">
          <button class="btn btn--ghost" data-copy="${esc(copyText)}">예약 정보 복사</button>
          ${r.link ? `<a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.linkName||"예약 확인")}</a>` : ""}
        </div>
      </div>
    </article>`;
  }).join("") : `<p class="empty">시트의 '예약' 행에 내용을 추가하면 여기에 표시됩니다.</p>`;

  // --- 일정 ---
  const today = ymd(new Date());
  $("itinerary").innerHTML = days.length ? days.map(name => {
    const isToday = dayDates[name] === today;
    return `
    <section class="day ${isToday ? "day--today" : ""}">
      <div class="day__head">
        <span class="day__name">${esc(name)}</span>
        ${isToday ? `<span class="day__now">TODAY</span>`
                  : dayDates[name] ? `<span class="day__date">${esc(dayDates[name].slice(5).replace("-","/"))}</span>` : ""}
      </div>
      <div class="day__body">
        ${dayMap[name].map(e => `
          <div class="stop">
            <div class="stop__time ${e.min===null?"is-blank":""}">${e.min!==null ? fmtTime(e.min) : "—"}</div>
            <div class="stop__main">
              ${e.title ? `<span class="stop__title">${esc(e.title)}</span>` : ""}
              ${e.detail ? `<span class="stop__desc">${nl(e.detail)}</span>` : ""}
              ${e.link ? `<a class="btn btn--ghost" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.linkName||"지도 보기")}</a>` : ""}
            </div>
          </div>`).join("")}
      </div>
    </section>`;
  }).join("") : `<p class="empty">시트의 '일정' 행에 내용을 추가하면 여기에 표시됩니다.</p>`;

  // --- 공지 ---
  $("notice").innerHTML = info["공지"]
    ? `<div class="notice"><span class="notice__mark">MEMO</span>${nl(info["공지"])}</div>`
    : `<p class="empty">등록된 메모가 없습니다.</p>`;

  // --- 오프라인 안내 ---
  if(meta && meta.stale){
    const el = $("stale");
    el.className = "stale";
    el.innerHTML = `저장된 사본 · ${esc(meta.savedAt)}<button type="button" id="retry">다시 불러오기</button>`;
    el.hidden = false;
    $("retry").addEventListener("click", ()=>location.reload());
  }

  $("loading").style.display = "none";
  $("app").hidden = false;
  render();
}

function drawToday(dayMap, days, dayDates){
  const el = $("today");
  const today = ymd(new Date());
  const idx = days.findIndex(d => dayDates[d] === today);
  if(idx === -1) return;

  const now = new Date().getHours()*60 + new Date().getMinutes();
  const list = dayMap[days[idx]] || [];
  const upcoming = list.filter(e => e.min !== null && e.min >= now - 30).slice(0,2);

  const rows = upcoming.length ? upcoming.map(e => `
    <div class="today__row">
      <div class="today__time">${fmtTime(e.min)}</div>
      <div>
        <div class="today__task">${esc(e.title || "일정")}</div>
        ${e.detail ? `<div class="today__note">${esc(e.detail.split("\n")[0])}</div>` : ""}
      </div>
    </div>`).join("")
    : `<div class="today__row"><p class="today__empty">오늘 남은 일정이 없습니다. 푹 쉬세요.</p></div>`;

  el.innerHTML = `
    <div class="today__head">TODAY <span class="today__day">${esc(days[idx])}</span></div>
    ${rows}
    <button class="today__go" data-go="itinerary">오늘 일정 전체 보기 →</button>`;
  el.hidden = false;
}

function drawFailure(){
  $("loading").innerHTML = `
    <div class="fail">
      <h2>일정을 불러오지 못했습니다</h2>
      <p>네트워크 연결을 확인하거나, 스프레드시트가 '웹에 게시' 상태인지 확인해 주세요. 한 번이라도 접속한 적이 있다면 저장된 사본이 표시됩니다.</p>
      <button class="btn" onclick="location.reload()">다시 시도</button>
    </div>`;
}

/* =========================================================
   불러오기 (네트워크 → 실패 시 저장된 사본)
   ========================================================= */
function load(){
  Papa.parse(CSV_URL + "&_=" + Date.now(), {
    download: true,
    header: true,
    complete(results){
      const rows = results.data || [];
      if(!rows.length) return fallback();
      store(CACHE_KEY, { rows, savedAt: new Date().toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) });
      draw(parseRows(rows), null);
    },
    error: fallback
  });
}
function fallback(){
  const cached = read(CACHE_KEY);
  if(cached && cached.rows) draw(parseRows(cached.rows), { stale:true, savedAt:cached.savedAt });
  else drawFailure();
}
load();

/* 오프라인 지원 (GitHub Pages에서만 동작) */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
